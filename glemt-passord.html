  <header class="site-header">
    <div class="container">
      <h1 class="logo"><a href="index.html" class="logo-link">Den Brune Løype</a></h1>

  <main>
    <section class="auth-section">
      <div class="auth-card">
        <h3>Glemt passord</h3>
        <form id="forgot-form">
          <div class="auth-field">
            <label for="identifier">Brukernavn eller e-post</label>
            <input type="text" id="identifier" required>
          </div>
          <button type="submit" class="btn auth-submit">Send tilbakestillingslenke</button>
        </form>
        <div id="auth-message" class="auth-message"></div>
        <div class="auth-links">
          <a href="login.html">Tilbake til innlogging</a>
        </div>
      </div>
    </section>
