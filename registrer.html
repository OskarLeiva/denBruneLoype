<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>denBruneLoype - Opprett konto</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo"><a href="index.html" class="logo-link">denBruneLoype</a></h1>
      <nav>
        <ul>
          <li><a href="index.html#hjem">Hjem</a></li>
          <li><a href="index.html#om">Om</a></li>
          <li><a href="loyper.html">Løyper</a></li>
          <li><a href="index.html#kontakt">Kontakt</a></li>
          <li id="admin-nav-item" style="display: none;"><a href="brukerforesporsler.html">Brukerforespørsler</a></li>
          <li><a href="login.html" id="auth-nav-link">Logg inn</a></li>
          <li><a href="map.html" class="nav-cta">Kart over barer</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-card">
        <h3>Opprett konto</h3>
        <form id="register-form">
          <div class="auth-field">
            <label for="username">Brukernavn</label>
            <input type="text" id="username" autocomplete="username" required>
          </div>
          <div class="auth-field">
            <label for="email">E-post</label>
            <input type="email" id="email" autocomplete="email" required>
          </div>
          <div class="auth-field">
            <label for="password">Passord</label>
            <input type="password" id="password" autocomplete="new-password" required minlength="6">
          </div>
          <div class="auth-field">
            <label for="password2">Gjenta passord</label>
            <input type="password" id="password2" autocomplete="new-password" required minlength="6">
          </div>
          <button type="submit" class="btn auth-submit">Opprett konto</button>
        </form>
        <div id="auth-message" class="auth-message"></div>
        <div class="auth-links">
          <a href="login.html">Har du allerede konto? Logg inn</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 denBruneLoype</p>
    </div>
  </footer>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/registrer.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
